name: Sync BDPM

# Télécharge les fichiers officiels de la BDPM et les importe dans MongoDB.
# Exige un secret de dépôt nommé exactement MONGO_URI
# (Settings → Secrets and variables → Actions → onglet « Secrets »).

on:
  schedule:
    - cron: "0 3 * * 1"   # chaque lundi à 3 h UTC (GitHub peut retarder l'exécution)
  workflow_dispatch:

# Une seule synchronisation à la fois : une exécution manuelle lancée pendant
# l'exécution planifiée attend au lieu d'écrire en même temps dans la base.
concurrency:
  group: sync-bdpm
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Vérifier que le secret MONGO_URI existe
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          if [ -z "$MONGO_URI" ]; then
            echo "::error title=Secret MONGO_URI manquant::Ajoutez-le dans Settings → Secrets and variables → Actions → onglet Secrets → New repository secret (nom exact : MONGO_URI). Un secret placé dans l'onglet « Variables » ou dans un « Environment » n'est pas lu par ce workflow."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --omit=dev

      - name: Synchroniser la BDPM
        run: npm run bdpm:sync
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
